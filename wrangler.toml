#:schema node_modules/wrangler/config-schema.json

name = "eplayerx-homepage"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# 移除顶层的 zone_id，直接使用路由配置中的 zone_name 或 zone_id 字段

workers_dev = true

# 修改路由配置
routes = [
	{ pattern = "api.chenluo.cyou", custom_domain = true },
	{ pattern = "tmdb.chenluo.cyou", custom_domain = true },
	# 带路径的路由不需要 custom_domain = true
	{ pattern = "chenluo.cyou/blocks*", zone_id = "1d216f8f5c76c12b32acadba4ae8c90d" }
]

[placement]
mode = "smart"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "eplayerx-homepage"
database_id = "7a464001-94aa-4eca-85b5-5a7a9beb16a9"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "crawler"
