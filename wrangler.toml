#:schema node_modules/wrangler/config-schema.json

name = "eplayerx-homepage"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# 修改这里的路由配置
# Public routes for this Worker.
# 使用这种格式，不要加 custom_domain = true
routes = [
	{ pattern = "api.chenluo.cyou/*", zone_name = "chenluo.cyou" },
	{ pattern = "tmdb.chenluo.cyou/*", zone_name = "chenluo.cyou" },
	{ pattern = "chenluo.cyou/blocks*", zone_name = "chenluo.cyou" }
]

[placement]
mode = "smart"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "eplayerx-homepage"
database_id = "7a464001-94aa-4eca-85b5-5a7a9beb16a9"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "crawler"
