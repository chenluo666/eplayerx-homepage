name = "eplayerx-homepage"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Keep the default *.workers.dev address alive.
workers_dev = true

# 👇 【你的专属域名配置，已完美替换为 epx 前缀】
routes = [
 # 拦截所有子域名 (完美覆盖 epx, tmdb, 以及未来你随便乱造的任何前缀)
 { pattern = "*.chenluo.cyou/*", zone_name = "chenluo.cyou" },

 # 拦截根域名 (为了兼容原代码里的 ikuu.eu.org/blocks* 路径)
 { pattern = "chenluo.cyou/*", zone_name = "chenluo.cyou" },
]

[placement]
mode = "smart"

[observability]
enabled = true

# 👇 【新增】环境变量配置（用于解决之前的 API 密码报错问题）
